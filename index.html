<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Linguistic Agents — Agentic Form</title>
    <link rel="stylesheet" href="/apps/rulebase-demo/style.css">
</head>
<body>
    <main class="page">
        <section class="card">
            <h1>Agentic Form</h1>

            <div class="field">
                <label for="ruleBaseUrl">Agentic Form URL</label>
                <input
                    id="ruleBaseUrl"
                    type="url"
                    placeholder="https://data.example.com/concept/">
            </div>

            <div id="ruleBaseStatus" class="status" aria-live="polite"></div>

            <div class="field sentence-field">
                <label for="sentenceInput">Sentence</label>
                <textarea
                    id="sentenceInput"
                    rows="5"
                    placeholder="Type a sentence here."></textarea>
            </div>

            <button id="processButton" type="button">Process Sentence</button>

            <pre id="output" class="output">No sentence processed.</pre>
        </section>
    </main>

    <script src="/apps/rulebase-demo/app.js"></script>
</body>
</html>
